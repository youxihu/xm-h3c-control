# 端口映射配置 - 内网端口到外网端口的映射
port_mappings:
  61002: 61002
  61100: 61100
  48080: 48099
  62201: 62201

# 端口描述配置
port_descriptions:
  61002:
    name: "drone_control_link"
    description: "侦测无人机控制链路端口"
  61100:
    name: "drone_data_link"
    description: "侦测无人机数据链路端口"
  62201:
    name: "tianbo_luoguang"
    description: "天波珞光设备"
  48080:
    name: "dongwu_backend"
    description: "东吴后端端口"

hosts:
  192.168.1.107:
    env: dev
    services:
      drone_control_link: 61002
      drone_data_link: 61100
      tianbo_luoguang: 62201
      dongwu_backend: 48080
  192.168.1.94:
    env: zc-test
    services:
      drone_control_link: 61002
      drone_data_link: 61100
      tianbo_luoguang: 62201
  192.168.1.116:
    env: dw-test
    services:
      dongwu_backend: 48080
  192.168.1.113:
    env: zg-test
    services:
      tianbo_luoguang: 62201
  192.168.1.93:
    env: zc-hangshi
    services:
      drone_control_link: 61002
      drone_data_link: 61100
  